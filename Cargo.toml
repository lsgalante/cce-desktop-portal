[package]
name = "cce-desktop-portal"
version = "0.1.0"
edition = "2021"
description = "Settings and Inhibit portal backends, and org.freedesktop.ScreenSaver, for the cce desktop"
license = "GPL-3.0-only"

[dependencies]
# The control socket's name and request lines (ipc::ctl) and the /run/cce
# plan files (plan); GUI-free, without the KDL config.
cce-core = { git = "https://github.com/lsgalante/cce-core.git", rev = "5b8dcb30f1b0d7d607ab49d637069560eca0cb14", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }
inotify = "0.11"
kdl = "4.6"
serde_json = "1"
log = "0.4"
env_logger = "0.11"
